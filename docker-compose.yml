# No local database service: the database is Supabase PostgreSQL, reached
# remotely via DATABASE_URL (see .env.example). This compose file only runs
# the API container itself.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
