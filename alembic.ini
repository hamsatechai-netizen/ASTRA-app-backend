[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

; sqlalchemy.url is intentionally omitted here — migrations/env.py sets it
; dynamically from app.config.settings so the DB URL is never duplicated
; (or committed) outside of the application's own configuration.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
